name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p public
          cp index.html public/index.html
          if [ -f profile.jpeg ]; then cp profile.jpeg public/profile.jpeg; fi
          if [ -f profile.jpg ]; then cp profile.jpg public/profile.jpg; fi
          if [ -f profile.png ]; then cp profile.png public/profile.png; fi
          if [ -f portfolio-character.webp ]; then cp portfolio-character.webp public/portfolio-character.webp; fi
          touch public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
